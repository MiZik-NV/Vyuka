<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grafy – procvičování</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f3f6fb}
*{box-sizing:border-box}body{margin:0;padding:22px}.app{max-width:1160px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:clamp(1.5rem,3vw,2.1rem);margin:0 0 4px}.sub{color:#5c667a}
button,select,input{font:inherit}button{border:0;border-radius:10px;padding:10px 15px;background:#2459c4;color:white;font-weight:650;cursor:pointer}
button.secondary{background:#e5ebf6;color:#20304e}button:disabled{opacity:.5;cursor:not--allowed}
.panel{background:white;border:1px solid #e0e6f0;border-radius:16px;padding:18px;box-shadow:0 4px 16px #1720330a;margin-bottom:18px}
.panel h2{font-size:1.12rem;margin:0 0 12px}
.settings{display:flex;gap:18px;flex-wrap:wrap;align-items:end}
.setting{display:flex;flex-direction:column;gap:6px}.setting>label,.setting-title{font-size:.9rem;color:#46536a;font-weight:650}
select{border:1px solid #cbd5e4;border-radius:8px;padding:9px;background:white;min-width:120px}
.checks{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:8px 0}
.checks label{display:flex;gap:7px;align-items:center;font-size:.92rem;color:#34425a}
input[type=checkbox]{width:17px;height:17px;accent-color:#2459c4}
#workspace{display:none}.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:18px}
.graph-wrap{background:#fbfcff;border:1px solid #e5eaf3;border-radius:12px;min-height:390px;display:grid;place-items:center;padding:8px}
svg{width:100%;height:auto;max-height:540px;overflow:visible;touch-action:none;user-select:none}.edge{stroke:#8390a5;stroke-width:3;fill:none}.edge-label{font-size:13px;fill:#34425a;text-anchor:middle;paint-order:stroke;stroke:#fbfcff;stroke-width:5px;stroke-linejoin:round}.vertex{fill:#e8f0ff;stroke:#2459c4;stroke-width:3}.vertex-label{font-size:17px;font-weight:750;fill:#183b80;text-anchor:middle;dominant-baseline:central}
.graph-note{font-size:.86rem;color:#657087;margin:10px 2px 0}
.question{padding:13px 0;border-bottom:1px solid #edf0f5}.question:last-child{border-bottom:0}
.qtitle{font-weight:650;margin-bottom:8px}.qdesc{font-size:.86rem;color:#657087;margin:-3px 0 8px}
.answer{width:100%;border:1px solid #cbd5e4;border-radius:9px;padding:9px 10px;background:white}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.result{margin-top:15px;padding:12px;border-radius:10px;background:#f0f4fb;color:#34425a;display:none}
.result.good{background:#e8f7ed;color:#176337}.result.bad{background:#fff0ed;color:#923b2d}
.feedback{font-size:.85rem;margin-top:6px}.ok{color:#16713d;font-weight:650}.no{color:#a33c30;font-weight:650}
.score{font-weight:750;margin-bottom:5px}.muted{color:#657087;font-size:.9rem}
@media(max-width:820px){body{padding:12px}.layout{grid-template-columns:1fr}.graph-wrap{min-height:280px}}
</style>
</head>
<body>
<div class="app">
<header>
 <div><h1>Grafy – procvičování</h1><div class="sub">Nejprve nastav parametry grafu, potom vygeneruj zadání a vyřeš otázky.</div></div>
</header>

<section class="panel">
 <h2>1. Nastavení grafu</h2>
 <div class="settings">
  <div class="setting"><span class="setting-title">Typ grafu</span>
   <div class="checks">
    <label><input type="checkbox" id="weighted" checked> Ohodnocený</label>
    <label><input type="checkbox" id="directed"> Orientovaný</label>
   </div>
  </div>
  <div class="setting"><label for="difficulty">Obtížnost</label>
   <select id="difficulty"><option value="easy">Lehká</option><option value="medium" selected>Střední</option><option value="hard">Těžká</option></select>
  </div>
  <button id="generate">Vygenerovat graf a otázky</button>
 </div>
 <div class="muted" style="margin-top:10px">Obtížnost ovlivňuje počet vrcholů i hran. Po změně nastavení znovu vygeneruj graf.</div>
</section>

<div id="workspace">
 <div class="layout">
  <section class="panel">
   <h2>2. Graf</h2>
   <div class="graph-wrap"><svg id="graph" viewBox="0 0 600 430" role="img" aria-label="Vygenerovaný graf"></svg></div>
   <div class="graph-note" id="graphNote"></div>
  </section>
  <section class="panel">
   <h2>3. Otázky</h2>
   <div id="questions"></div>
   <div class="actions">
    <button id="check">Vyhodnotit odpovědi</button>
    <button class="secondary" id="showAnswers">Ukázat řešení</button>
    <button class="secondary" id="clear">Vymazat odpovědi</button>
   </div>
   <div id="result" class="result" aria-live="polite"></div>
  </section>
 </div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
let graph={vertices:[],edges:[],weighted:false,directed:false}, tasks={};
const $=id=>document.getElementById(id);
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function edgeKey(a,b,directed=graph.directed){return directed?a+'>'+b:[a,b].sort().join('-')}
function getEdge(a,b){return graph.edges.find(e=>edgeKey(e.a,e.b)===edgeKey(a,b))}
function outgoing(v){return graph.edges.filter(e=>e.a===v).map(e=>e.b)}
function adjacent(v){
 const found=new Set();
 graph.edges.forEach(e=>{if(e.a===v)found.add(e.b);if(e.b===v)found.add(e.a)});
 return [...found].sort();
}
function addEdge(edges,a,b,weighted){
 const key=edgeKey(a,b);
 if(a===b||edges.some(e=>edgeKey(e.a,e.b)===key))return;
 edges.push({a,b,w:weighted?rand(1,9):1});
}
function generateGraph(){
 const difficulty=$('difficulty').value;
 const n=difficulty==='easy'?rand(5,6):difficulty==='medium'?rand(7,8):8;
 const vertices=Array.from({length:n},(_,i)=>String.fromCharCode(65+i));
 const weighted=$('weighted').checked,directed=$('directed').checked;
 // Nejprve vytvoříme různé dvojice vrcholů (kostra cyklu + doplňkové spojnice).
 // Na každé dvojici pak nezávisle stanovíme směr a váhy hran.
 const pairs=[],keys=new Set();
 function addPair(a,b){
  if(a===b)return false;
  const key=[a,b].sort().join('-');
  if(keys.has(key))return false;
  keys.add(key);pairs.push({a,b});return true;
 }
 for(let i=0;i<n;i++)addPair(vertices[i],vertices[(i+1)%n]);
 let extra=difficulty==='easy'?rand(0,1):difficulty==='medium'?rand(2,4):rand(5,8);
 let attempts=0;
 while(extra>0&&attempts++<n*n*5){
  if(addPair(vertices[rand(0,n-1)],vertices[rand(0,n-1)]))extra--;
 }
 const edges=[];
 const push=(a,b,w)=>edges.push({a,b,w,color:0});
 for(const {a,b} of pairs){
  if(!directed){push(a,b,weighted?rand(1,9):1);continue}
  // Lehká obtížnost: směs jednosměrných a obousměrných hran.
  // Dvě protisměrné hrany mají v lehké obtížnosti vždy stejnou váhu
  // (nikdy se nevykreslí jako dva oblouky).
  // U neohodnocených grafů ve střední/těžké obtížnosti zachováme
  // předchozí pravidlo: pouze obousměrná spojení.
  const both=difficulty==='easy'?Math.random()<0.65:(!weighted||Math.random()<0.82);
  if(!both){
   // Jednosměrné spojení lze použít i v lehké obtížnosti.
   if(Math.random()<0.5)push(a,b,weighted?rand(1,9):1);
   else push(b,a,weighted?rand(1,9):1);
   continue;
  }
  const firstW=weighted?rand(1,9):1;
  let secondW=firstW;
  if(weighted&&difficulty!=='easy'&&Math.random()<0.52){
   // Zaručeně různá hodnota – zobrazíme dva samostatné oblouky.
   secondW=rand(1,8);
   if(secondW>=firstW)secondW++;
  }
  push(a,b,firstW);push(b,a,secondW);
 }
 graph={vertices,edges,weighted,directed,vertexColors:{},positions:{}};
 makeTasks();draw();renderQuestions();
 $('workspace').style.display='block';$('result').style.display='none';
 $('graphNote').textContent=directed
  ? (weighted?'Jednosměrná šipka dovoluje cestu jedním směrem. Obousměrná má stejnou váhu v obou směrech; rozdílné váhy zobrazují dva oblouky. Kliknutím barvíš, tažením přesouváš vrcholy.':'Jednosměrná šipka dovoluje cestu jedním směrem; obousměrná představuje dvě orientované hrany. Kliknutím barvíš, tažením přesouváš vrcholy.')
  : (weighted?'Čísla udávají váhy hran. Kliknutím barvíš hrany a vrcholy, tažením přesouváš vrcholy.':'Hranami lze procházet oběma směry. Kliknutím barvíš, tažením přesouváš vrcholy.');
}
const vertexColors=['#e8f0ff','#ffe1a8','#bcebd2'];
const edgeColors=['#8390a5','#e06a36','#188c9e'];
function draw(){
 const svg=$('graph');svg.innerHTML='';
 const defs=document.createElementNS(NS,'defs');
 for(let i=0;i<edgeColors.length;i++){
  for(const dir of ['start','end']){
   const marker=document.createElementNS(NS,'marker');
   marker.setAttribute('id',`arrow-${dir}-${i}`);
   marker.setAttribute('markerWidth','12');marker.setAttribute('markerHeight','12');
   marker.setAttribute('viewBox','0 0 12 12');
   marker.setAttribute('refX',dir==='end'?'10':'2');marker.setAttribute('refY','6');
   marker.setAttribute('orient',dir==='start'?'auto-start-reverse':'auto');
   marker.setAttribute('markerUnits','userSpaceOnUse');
   const arrow=document.createElementNS(NS,'path');arrow.setAttribute('d','M1,1 L11,6 L1,11 Z');
   arrow.setAttribute('fill',edgeColors[i]);marker.appendChild(arrow);defs.appendChild(marker);
  }
 }
 svg.appendChild(defs);
 // Eliptické rozmístění jako v předchozí verzi; vrcholy lze ručně posouvat.
 const shuffled=[...graph.vertices];
 for(let i=shuffled.length-1;i>0;i--){const j=rand(0,i);[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}
 const angle0=-Math.PI/2+Math.random()*Math.PI*2;
 shuffled.forEach((v,i)=>{
  const angle=angle0+i*2*Math.PI/shuffled.length;
  graph.positions[v]={x:300+220*Math.cos(angle),y:215+160*Math.sin(angle)};
 });
 const renderedEdges=[],used=new Set();
 for(const e of graph.edges){
  if(used.has(e))continue;
  const reverse=graph.directed?graph.edges.find(x=>x!==e&&x.a===e.b&&x.b===e.a):null;
  const shared=!!reverse&&e.w===reverse.w;
  if(shared)used.add(reverse);
  used.add(e);
  // Každý jednotlivý směr s jinou váhou dostane vlastní zakřivenou dráhu.
  const curved=!!reverse&&!shared;
  const parts=shared?[e,reverse]:[e];
  const path=document.createElementNS(NS,'path');path.setAttribute('class','edge');
  const hit=document.createElementNS(NS,'path');hit.setAttribute('fill','none');
  hit.setAttribute('stroke','transparent');hit.setAttribute('stroke-width','17');hit.style.cursor='pointer';
  const weightLabel=graph.weighted?document.createElementNS(NS,'text'):null;
  if(weightLabel){weightLabel.setAttribute('class','edge-label');weightLabel.style.pointerEvents='none';weightLabel.textContent=e.w}
  const rendered={e,parts,shared,curved,path,hit,weightLabel};renderedEdges.push(rendered);
  hit.setAttribute('aria-label',`Změnit barvu hrany ${e.a} ${graph.directed?'do':'a'} ${e.b}`);
  hit.addEventListener('click',()=>{
   const c=((e.color||0)+1)%3;
   for(const part of parts)part.color=c;
   updateEdgeStyle(rendered);
  });
  svg.appendChild(path);svg.appendChild(hit);if(weightLabel)svg.appendChild(weightLabel);
  updateEdgeStyle(rendered);
 }
 function updateEdgeStyle(r){
  const c=r.e.color||0;
  r.path.style.stroke=edgeColors[c];
  r.path.setAttribute('marker-start',r.shared?'url(#arrow-start-'+c+')':'none');
  r.path.setAttribute('marker-end',graph.directed?'url(#arrow-end-'+c+')':'none');
  if(r.weightLabel)r.weightLabel.style.fill=edgeColors[c];
 }
 const vertexShapes={};
 graph.vertices.forEach(v=>{
  const g=document.createElementNS(NS,'g');g.style.cursor='grab';g.style.touchAction='none';
  const c=document.createElementNS(NS,'circle');c.setAttribute('r',23);c.setAttribute('class','vertex');
  c.style.fill=vertexColors[graph.vertexColors[v]||0];
  const t=document.createElementNS(NS,'text');t.setAttribute('class','vertex-label');t.textContent=v;t.style.pointerEvents='none';
  g.append(c,t);svg.appendChild(g);vertexShapes[v]={g,c,t};
  g.addEventListener('pointerdown',event=>{
   if(event.button!==0)return;
   event.preventDefault();
   const at=svgPoint(event);
   activeDrag={id:event.pointerId,v,from:at,last:at,moved:false};
   g.style.cursor='grabbing';svg.setPointerCapture(event.pointerId);
  });
 });
 function svgPoint(event){
  const m=svg.getScreenCTM();if(!m)return {x:0,y:0};
  const p=new DOMPoint(event.clientX,event.clientY).matrixTransform(m.inverse());
  return {x:p.x,y:p.y};
 }
 function updateGeometry(){
  for(const r of renderedEdges){
   const p=graph.positions[r.e.a],q=graph.positions[r.e.b];
   const dx=q.x-p.x,dy=q.y-p.y,len=Math.max(1,Math.hypot(dx,dy));
   const ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
   const offset=graph.directed?30:23;
   const x1=p.x+ux*offset,y1=p.y+uy*offset,x2=q.x-ux*offset,y2=q.y-uy*offset;
   let d,wx,wy;
   if(r.curved){
    // Oba opačné směry dostanou svůj oblouk: jejich normály se obracejí.
    const bend=Math.min(53,Math.max(28,len*0.18));
    const cx=(p.x+q.x)/2+nx*bend*2,cy=(p.y+q.y)/2+ny*bend*2;
    // Konce dráhy po kvadratické křivce ponecháváme před kruhy.
    const bezier=t=>({x:(1-t)*(1-t)*p.x+2*(1-t)*t*cx+t*t*q.x,
                      y:(1-t)*(1-t)*p.y+2*(1-t)*t*cy+t*t*q.y});
    let lo=0,hi=0.5;
    for(let i=0;i<24;i++){const mid=(lo+hi)/2,b=bezier(mid);
     if(Math.hypot(b.x-p.x,b.y-p.y)<31)lo=mid;else hi=mid}
    const ts=hi;
    lo=0.5;hi=1;
    for(let i=0;i<24;i++){const mid=(lo+hi)/2,b=bezier(mid);
     if(Math.hypot(b.x-q.x,b.y-q.y)>31)lo=mid;else hi=mid}
    const te=lo,st=bezier(ts),en=bezier(te),middle=bezier((ts+te)/2);
    const ctl={x:2*middle.x-(st.x+en.x)/2,y:2*middle.y-(st.y+en.y)/2};
    d=`M ${st.x} ${st.y} Q ${ctl.x} ${ctl.y} ${en.x} ${en.y}`;
    const mid=bezier(0.5);wx=mid.x+nx*12;wy=mid.y+ny*12-5;
   }else{
    d=`M ${x1} ${y1} L ${x2} ${y2}`;
    wx=(p.x+q.x)/2-uy*13;wy=(p.y+q.y)/2+ux*13-5;
   }
   r.path.setAttribute('d',d);r.hit.setAttribute('d',d);
   if(r.weightLabel){r.weightLabel.setAttribute('x',wx);r.weightLabel.setAttribute('y',wy)}
  }
  for(const v of graph.vertices){const p=graph.positions[v];vertexShapes[v].g.setAttribute('transform',`translate(${p.x} ${p.y})`)}
 }
 let activeDrag=null;
 svg.addEventListener('pointermove',event=>{
  if(!activeDrag||activeDrag.id!==event.pointerId)return;
  const point=svgPoint(event),last=activeDrag.last;
  if(Math.hypot(point.x-activeDrag.from.x,point.y-activeDrag.from.y)>5)activeDrag.moved=true;
  if(activeDrag.moved){
   const pos=graph.positions[activeDrag.v];
   pos.x=Math.min(565,Math.max(35,pos.x+point.x-last.x));
   pos.y=Math.min(395,Math.max(35,pos.y+point.y-last.y));
   updateGeometry();
  }
  activeDrag.last=point;
 });
 function finishDrag(event){
  if(!activeDrag||activeDrag.id!==event.pointerId)return;
  const drag=activeDrag;activeDrag=null;
  vertexShapes[drag.v].g.style.cursor='grab';
  if(!drag.moved&&event.type==='pointerup'){
   graph.vertexColors[drag.v]=((graph.vertexColors[drag.v]||0)+1)%3;
   vertexShapes[drag.v].c.style.fill=vertexColors[graph.vertexColors[drag.v]];
  }
  if(svg.hasPointerCapture(event.pointerId))svg.releasePointerCapture(event.pointerId);
 }
 svg.addEventListener('pointerup',finishDrag);
 svg.addEventListener('pointercancel',finishDrag);
 updateGeometry();
}
function neighbors(v){return graph.directed?outgoing(v).sort():adjacent(v)}
function pathCost(path){let total=0;for(let i=0;i<path.length-1;i++){let e=getEdge(path[i],path[i+1]);if(!e)return Infinity;total+=e.w}return total}
function shortest(start,end,byWeight){
 const dist=Object.fromEntries(graph.vertices.map(v=>[v,Infinity])),prev={};dist[start]=0;
 const todo=new Set(graph.vertices);
 while(todo.size){
  let u=[...todo].sort((a,b)=>dist[a]-dist[b])[0];todo.delete(u);
  if(dist[u]===Infinity||u===end)break;
  for(let v of neighbors(u)){
   if(!todo.has(v))continue;
   const e=getEdge(u,v),cost=byWeight&&graph.weighted?e.w:1,nd=dist[u]+cost;
   if(nd<dist[v]){dist[v]=nd;prev[v]=u}
  }
 }
 let path=[end];while(path[0]!==start&&prev[path[0]])path.unshift(prev[path[0]]);
 return {path:path[0]===start?path:[],cost:dist[end]};
}
function randomPair(){
 const pairs=[];
 for(const a of graph.vertices)for(const b of graph.vertices)if(a!==b)pairs.push([a,b]);
 return pairs[rand(0,pairs.length-1)];
}
function makeTasks(){
 const [adjV]=[graph.vertices[rand(0,graph.vertices.length-1)]];
 const [pStart,pEnd]=randomPair(),[sStart,sEnd]=randomPair();
 tasks={countV:graph.vertices.length,countE:graph.edges.length,neighbors:{v:adjV,answer:neighbors(adjV)}};
 tasks.path={start:pStart,end:pEnd,answer:shortest(pStart,pEnd,false).path};
 // Hlavní otázka: u ohodnoceného grafu podle součtu vah, jinak podle počtu hran.
 tasks.shortest={start:sStart,end:sEnd,...shortest(sStart,sEnd,graph.weighted)};
 if(graph.weighted){
  let [hStart,hEnd]=randomPair();
  tasks.hops={start:hStart,end:hEnd,...shortest(hStart,hEnd,false)};
 }
}
function renderQuestions(){
 const items=[
  ['countV','Kolik má graf vrcholů?','Zapiš počet.','number'],
  ['countE',graph.directed?'Kolik má graf orientovaných hran?':'Kolik má graf hran?',graph.directed?'Obousměrná šipka představuje dvě orientované hrany.':'Zapiš počet.','number'],
  ['neighbors',`Se kterými vrcholy přímo sousedí vrchol ${tasks.neighbors.v}?`,graph.directed?'Napiš vrcholy, do kterých vede šipka z daného vrcholu (např. ACF).' :'Napiš například ACF, A,C,F nebo A C F.','text'],
  ['path',`Najdi cestu z ${tasks.path.start} do ${tasks.path.end}.`,graph.directed?'Dodržuj směr šipek. Zapiš například ACDF nebo A-C-D-F.':'Zapiš posloupnost vrcholů, například ABD nebo A-B-D.','text'],
  ['shortest',`Najdi nejkratší cestu z ${tasks.shortest.start} do ${tasks.shortest.end}.`,graph.weighted?'Hledej cestu s nejmenším součtem vah hran.':'Hledej cestu s nejmenším počtem hran.','text']
 ];
 if(graph.weighted)items.push(['hops',`Najdi nejkratší cestu z ${tasks.hops.start} do ${tasks.hops.end} podle počtu navštívených vrcholů.`,'Počítej počet vrcholů na cestě, nikoli součet vah hran.','text']);
 const q=$('questions');q.innerHTML='';
 items.forEach(([id,title,desc,type],i)=>{
  const d=document.createElement('div');d.className='question';
  const titleEl=document.createElement('div');titleEl.className='qtitle';titleEl.textContent=(i+1)+'. '+title;
  const descEl=document.createElement('div');descEl.className='qdesc';descEl.textContent=desc;
  const input=document.createElement('input');input.className='answer';input.id='ans-'+id;input.type=type;input.autocomplete='off';input.setAttribute('aria-label',title);
  const fb=document.createElement('div');fb.className='feedback';fb.id='fb-'+id;
  d.append(titleEl,descEl,input,fb);q.appendChild(d);
 });
}
function parsePath(s){
 const normalized=s.toUpperCase().replace(/\s/g,'');
 if(/^[A-Z]+$/.test(normalized))return [...normalized];
 return normalized.split(/[-,;>]+/).filter(Boolean);
}
function normalizeSet(s){return s.toUpperCase().match(/[A-Z]/g)?.sort()||[]}
function validPath(path,start,end){
 return path.length>=2&&path[0]===start&&path[path.length-1]===end&&path.every(v=>graph.vertices.includes(v))&&path.slice(1).every((v,i)=>!!getEdge(path[i],v))&&new Set(path).size===path.length;
}
function evaluate(){
 const checks=[];
 const add=(id,ok,correct)=>{checks.push(ok);$('fb-'+id).innerHTML=`<span class="${ok?'ok':'no'}">${ok?'Správně':'Nesprávně'}</span>${correct?` – správná odpověď: ${correct}`:''}`};
 add('countV',+$('ans-countV').value===tasks.countV,String(tasks.countV));
 add('countE',+$('ans-countE').value===tasks.countE,String(tasks.countE));
 const ns=normalizeSet($('ans-neighbors').value),right=tasks.neighbors.answer;
 add('neighbors',ns.length===right.length&&ns.every((x,i)=>x===right[i]),right.join(', ')||'žádný vrchol');
 const p=parsePath($('ans-path').value);
 add('path',validPath(p,tasks.path.start,tasks.path.end),tasks.path.answer.join('-'));
 const sp=parsePath($('ans-shortest').value),shortestOk=validPath(sp,tasks.shortest.start,tasks.shortest.end)&&
  (graph.weighted?pathCost(sp)===tasks.shortest.cost:sp.length-1===tasks.shortest.cost);
 add('shortest',shortestOk,`${tasks.shortest.path.join('-')} (${graph.weighted?'součet vah':'počet hran'}: ${tasks.shortest.cost})`);
 if(graph.weighted){
  const hp=parsePath($('ans-hops').value),hopsOk=validPath(hp,tasks.hops.start,tasks.hops.end)&&hp.length-1===tasks.hops.cost;
  add('hops',hopsOk,`${tasks.hops.path.join('-')} (${tasks.hops.path.length} vrcholů)`);
 }
 const score=checks.filter(Boolean).length,res=$('result');res.className='result '+(score===checks.length?'good':'bad');res.style.display='block';
 res.innerHTML=`<div class="score">Výsledek: ${score} / ${checks.length} správně</div>${score===checks.length?'Výborně! Všechny odpovědi jsou správné.':'Zkontroluj označené odpovědi a zkus to znovu.'}`;
}
function showAnswers(){
 $('ans-countV').value=tasks.countV;$('ans-countE').value=tasks.countE;
 $('ans-neighbors').value=tasks.neighbors.answer.join(', ');
 $('ans-path').value=tasks.path.answer.join('-');
 $('ans-shortest').value=tasks.shortest.path.join('-');
 if(graph.weighted)$('ans-hops').value=tasks.hops.path.join('-');
 evaluate();
}
function clearAnswers(){
 document.querySelectorAll('.answer').forEach(x=>x.value='');
 document.querySelectorAll('.feedback').forEach(x=>x.textContent='');
 $('result').style.display='none';
}
$('generate').addEventListener('click',generateGraph);
$('check').addEventListener('click',evaluate);
$('showAnswers').addEventListener('click',showAnswers);
$('clear').addEventListener('click',clearAnswers);
</script>
</body>
</html>
